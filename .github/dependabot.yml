# Dependabot: revisa cada semana si hay versiones nuevas (sobre todo parches de seguridad)
# de las librerías de npm y de las acciones de GitHub, y abre un pull request para actualizarlas.
# - Las actualizaciones pequeñas (menores y parches) llegan juntas en un solo PR.
# - Las versiones mayores (pueden traer cambios grandes) llegan cada una en su propio PR para revisarlas con calma.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dependencias:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      acciones:
        patterns: ['*']
        update-types: [minor, patch]
