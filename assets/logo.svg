<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="EarlyStock">
  <!--
    Logo de EarlyStock.
    Idea: una "E" formada por tres barras de stock que se van haciendo más cortas (el inventario bajando)
    y un punto dorado al final: la alerta temprana que avisa antes de que se acabe.
    Fondo: degradado morado -> magenta -> rosa con un brillo naranja de atardecer en la esquina.
  -->
  <defs>
    <linearGradient id="es-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset=".55" stop-color="#a21caf"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="es-sol" cx=".9" cy=".95" r=".65">
      <stop offset="0" stop-color="#fb923c" stop-opacity=".85"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#es-fondo)"/>
  <rect width="64" height="64" rx="16" fill="url(#es-sol)"/>
  <rect x="15" y="16" width="7" height="32" rx="3.5" fill="#fff"/>
  <rect x="15" y="16" width="34" height="7" rx="3.5" fill="#fff"/>
  <rect x="15" y="28.5" width="25" height="7" rx="3.5" fill="#fff" fill-opacity=".9"/>
  <rect x="15" y="41" width="15" height="7" rx="3.5" fill="#fff" fill-opacity=".8"/>
  <circle cx="40" cy="44.5" r="5" fill="#fde68a"/>
</svg>
